[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bilidl"
version = "0.1.0"
description = "B站视频下载器 —— 支持清晰度选择的本地下载 CLI"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "typer>=0.12",
    "rich>=13.7",
    "pydantic>=2.7",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[project.scripts]
bilidl = "bilidl.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/bilidl"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
