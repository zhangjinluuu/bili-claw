[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "biliclaw"
version = "0.1.2"
description = "哔哩娃娃机 / BiliClaw —— 投币，出爪，把喜欢抓回家。支持清晰度选择的 B站视频下载 CLI"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "typer>=0.12",
    "rich>=13.7",
    "pydantic>=2.7",
    # --login 要从 Chromium 系的 Cookie 库里解密（AES-128-CBC）。这是唯一用到它的地方，
    # 但「一键取 Cookie」是主打功能，让它需要额外交一步安装就失去意义了，所以列为必装。
    "cryptography>=42",
    # --login --qrcode 要在终端里画二维码。选 segno 是因为它纯 Python、零运行时依赖、
    # 不需要 Pillow（77 KB），而二维码**必须在本地生成**：二维码里编的是本次登录的
    # qrcode_key，谁拿到它谁就能用自己的手机扫完，让用户存下别人的账号。
    "segno>=1.6",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "ruff>=0.6"]

[project.scripts]
bili-claw = "biliclaw.cli:main"
bclaw = "biliclaw.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/biliclaw"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "ASYNC", "BLE", "RUF", "PYI"]
ignore = [
    # typer 的选项只能写成函数签名默认值里的 typer.Option(...)，这是框架规定的写法，
    # B008 在这里是误报。
    "B008",
    # RUF001/002/003 检查"有歧义的 Unicode 字符"（全角逗号、括号、冒号……）。
    # 本项目的注释、docstring 与面向用户的文案全是中文，全角标点正是中文的正确写法，
    # 改成半角反而难读。这三条规则只适用于纯英文代码库，这里整体关掉。
    "RUF001",
    "RUF002",
    "RUF003",
    # 分片写盘与 muxer 里的 Path 操作都是普通阻塞调用，每次只有 256KB 或一次
    # stat/unlink，开销在微秒级；而下载速度受网络限制，为这点开销引入
    # asyncio.to_thread 的线程池调度得不偿失。这是有意的取舍，不是疏漏。
    "ASYNC230",
    "ASYNC240",
]
